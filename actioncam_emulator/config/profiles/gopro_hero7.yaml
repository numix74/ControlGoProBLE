# Profil "legacy" : émule une GoPro Hero 5/6/7/8 (protocole BLE pré-OpenGoPro).
# Mêmes UUIDs GATT que les modèles récents, mais l'app n'envoie ni Claim
# Control (0xF1), ni register-updates protobuf (0x52/0x53/0x62), ni
# fetch-presets (0xF5). Elle s'appuie sur :
#   - CMD_GET_HARDWARE_INFO (0x3C) pour détecter "HERO7" → LEGACY
#   - CMD_SET_SHUTTER (0x01), HILIGHT (0x18), SLEEP (0x05), KEEP_ALIVE (0x5B),
#     SET_DATE (0x0D), SET_MODE_GROUP (0x02), SET_SUB_MODE (0x03)
#   - QRY_GET_STATUS (0x13) one-shot pour batterie/storage/recording

ble:
  service_uuid: "0000fea6-0000-1000-8000-00805f9b34fb"
  device_name: "GoPro7 Black"
  ap_ssid: "GP07567890"
  ap_password: "z9-Xk3@p"
  company_id: 0xF202
  characteristics:
    command:      "b5f90072-aa8d-11e3-9046-0002a5d5c51b"
    command_rsp:  "b5f90073-aa8d-11e3-9046-0002a5d5c51b"
    settings:     "b5f90074-aa8d-11e3-9046-0002a5d5c51b"
    settings_rsp: "b5f90075-aa8d-11e3-9046-0002a5d5c51b"
    query:        "b5f90076-aa8d-11e3-9046-0002a5d5c51b"
    query_rsp:    "b5f90077-aa8d-11e3-9046-0002a5d5c51b"

